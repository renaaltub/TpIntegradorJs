<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKINCORE - Productos</title>
    <link rel="icon" href="client/img/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="client/css/styles.css">
</head>
<body>
    <!-- ENCABEZADO -->
    <header class="header-totem">
        <div class="logo">
            <img src="client/img/logo.png" alt="Logo SKINCORE">
            <h1>SKINCORE</h1>
        </div>
        
        <!-- Barra de navegación accesible por botones y con íconos -->
        <nav class="nav-totem">
            <div class="nav-item-search">
                <input type="text" class="barra-busqueda" placeholder="Buscar producto...">
            </div>
            <div class="nav-botones">
                <a href="test.html" class="btn-nav">Testear mi piel</a>
                <a href="productos.html" class="btn-nav">Productos</a>

                <div class="header-icons">
                    <!-- Carrito con contador -->
                    <a href="carrito.html" title="Ver Carrito" class="carrito-icono-container">
                        <i class="fa-solid fa-shopping-cart"></i>
                        <span class="cart-count" id="contador-carrito">0</span>
                    </a>
                </div>
                <!-- btn de Modo Nocturno  -->
                <button id="btn-modo-oscuro" class="btn-modo-nocturno" title="Cambiar tema claro/oscuro">
                    <i class="fa-solid fa-moon" id="icono-tema"></i>
                </button>

                <a href="/admin/login" class="btn-nav btn-admin-link">Admin</a>
            </div>
        </nav>
    </header>

        <main class="main-totem">
            <!-- pantalla de productos -->
            <section id="productos-section" class="productos-screen">
                <div>
                    <h3 id="titulo-productos">Hola, <span id="nombre-cliente"></span></h3>
                    <p>Seleccioná la categoría que deseás explorar:</p>
                </div>
                <div class="categorias-container">
                    <button type="button" class="btn-categoria" data-categoria="cremas">Cremas</button>
                    <button type="button" class="btn-categoria" data-categoria="serums">Serums</button>
                    <button type="button" class="btn-categoria" data-categoria="mascarillas">Mascarillas y pads</button>
                </div>

                <!-- espacio de carga de productos x js -->
                <div id="productos-container" class="grilla-productos"></div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-container">
                <!-- LOGO -->
                <img src="client/img/logo.png" alt="Logo de la empresa">

                <div class="footer-links">
                    <a href="#">Inicio</a>
                    <a href="#">Test</a>
                    <a href="#">Productos</a>
                </div>

                <hr class="footer-separator">

                <div class="footer-content">
                    <p>&copy; 2026 SKINCORE. Todos los derechos reservados.</p>
                    <p>Programación III - División 132 | Proyecto Integrador 2026</p>
                    <p>Altube Renada - Grajeda Juliana</p>

                    <div class="social-media">
                        <a href="#" target="_blank">
                            <i class="fa-brands fa-instagram"></i>
                        </a>

                        <a href="#" target="_blank">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Carga de Scripts JS -->
        <script src="client/js/main.js"></script>
    </body>
</html>

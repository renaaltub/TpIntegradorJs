<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SKINCORE - Totem de skincare</title>
        <!-- ICON -->
        <link rel="icon" href="./src/public/img/logo.png" type="image/png">
        <!-- estilos -->
        <link rel="stylesheet" href="./src/public/css/styles.css">
        <!-- font awesome - ICONOS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>

    <body>
        <!-- encabezado -->
        <header class="header-totem">
            <div class="logo">
                <img src="./src/public/img/logo.png" alt="Logo SKINCORE">
                <h1>SKINCORE</h1>
            </div>

            <!-- Barra de navegación accesible por botones y con íconos -->
            <nav class="nav-totem">
                <div class="nav-item-search">
                    <input type="text" class="barra-busqueda" placeholder="Buscar producto...">
                </div>

                <div class="nav-botones">
                    <a href="productos.html" class="btn-nav">Productos</a>

                    <!-- Íconos solicitados en el header -->
                    <div class="header-icons">

                        <!-- Carrito con contador -->
                        <a href="carrito.html" title="Ver Carrito" class="carrito-icono-container">
                            <i class="fa-solid fa-shopping-cart"></i>
                            <span class="cart-count" id="contador-carrito">0</span>
                        </a>
                    </div>

                    <!-- Btn Modo Nocturno -->
                    <button id="btn-modo-oscuro" class="btn-modo-nocturno" title="Cambiar tema claro/oscuro">
                        <i class="fa-solid fa-moon" id="icono-tema"></i>
                    </button>

                </div>
            </nav>
        </header>

        <!-- Contenido principal -->
        <main class="main-totem">
            <section class="cart-screen">
                <h2>Carrito de Compras</h2>

                <!-- Lista de productos en el carrito -->
                <div class="cart-items" id="items-carrito">
                </div>

                <div class="cart-summary" id="total-carrito">
                    <p>Total: <span id="cart-total" class="precio-total">$0.00</span></p>
                    <button id="btn-vaciar-carrito" type="button">Vaciar carrito</button>
                    <button id="checkout-button">Finalizar Compra</button>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-container">
                <!-- LOGO -->
                <img src="./src/public/img/logo.png" alt="Logo de la empresa">

                <div class="footer-links">
                    <a href="index.html">Inicio</a>
                    <a href="productos.html">Productos</a>
                </div>

                <hr class="footer-separator">

                <div class="footer-content">
                    <p>&copy; 2026 SKINCORE. Todos los derechos reservados.</p>
                    <p>Programación III - División 132 | Proyecto Integrador 2026</p>
                    <p>Altube Renata - Grajeda Juliana</p>

                    <div class="social-media">
                        <a href="#" target="_blank">
                            <i class="fa-brands fa-instagram"></i>
                        </a>

                        <a href="#" target="_blank">
                            <i class="fa-brands fa-tiktok"></i>
                        </a>
                    </div>
                </div>
            </div>
        </footer>
        <!-- Carga de Scripts JS -->
        <script src="./src/public/js/main.js"></script>
    </body>
</html>
